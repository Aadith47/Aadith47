name: Generate Commit Hours Card

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:      # Allows manual trigger anytime

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Commit Hours Chart
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Aadith47
          template: classic
          base: "" # Hides standard headers/info
          filename: github-metrics-commits-hour.svg
          config_timezone: Asia/Kolkata # Sets UTC+5:30
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 30
          plugin_habits_facts: no
          plugin_habits_trim: yes
          config_theme_compact: yes
          # Colors matching your dark background & purple bars:
          config_order: habits
