name: Generate Commit Hours Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Commit Hours Chart
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aadith47
          template: classic
          base: ""
          filename: github-metrics-commits-hour.svg
          config_timezone: Asia/Kolkata
          
          # Habits plugin configuration
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_facts: no
          plugin_habits_trim: yes
          
          # Fail-safe options
          retries: 3
          retries_delay: 300
